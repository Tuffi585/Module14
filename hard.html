<!DOCTYPE html>
<html>
<head>
<title>Unleashing CSS Pseudo-elements and Opacity</title>
<style>
div {
    opacity: 0.7;
    padding: 20px;
    border: 2px solid black;
    position: relative;
}

div::before {
    content: "";
    position: absolute;
    top: -5px;
    left: -5px;
    right: -5px;
    bottom: -5px;
    border: 2px solid blue;
    box-shadow: 0 0 10px blue;
}

div::after {
    content: "";
    display: block;
    height: 5px;
    background-color: red;
    opacity: 0.5;
}
</style>
</head>
<body>

<div>Some text content.</div>

</body>
</html>
