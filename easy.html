=<!DOCTYPE html>
<html>
<head>
<title>CSS Combinators</title>
<style>
nav > ul > li {
    background-color: #1e3a8a;
    color: white;
    padding: 10px;
}

nav ul li + li {
    background-color: #2563eb;
}

nav ul li {
    color: white;
}
</style>
</head>
<body>
<nav>
<ul>
<li>Home</li>
<li>About</li>
<li>Contact</li>
</ul>
</nav>
</body>
</html>
